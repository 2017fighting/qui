name: Sync upstream

# Mirrors autobrr/qui into this fork: merges upstream/develop into develop and
# copies upstream's release tags. This fork's release.yml then builds and
# publishes the images for the merged branch and for every mirrored tag, which
# is why this workflow does not build anything itself.
#
# Pushes use the SYNC_TOKEN secret, a fine-grained personal access token with
# Contents: read and write and Workflows: read and write. The default
# GITHUB_TOKEN cannot do them: GitHub refuses to let a GitHub App token create
# or update a `.github/workflows/*` file, and both upstream's develop commits
# and every release tag's tree contain those files.
#
# Because SYNC_TOKEN is a real token, the events it creates do start other
# workflows: release.yml builds the images (its goreleaser job stays off until
# the repository variable PUBLISH_RELEASES is set, see release.yml), and the
# lint and test runs cover the synced commits.

on:
  schedule:
    # Every six hours, off the hour so it does not queue behind the cron rush.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra upstream tag to mirror, for example v1.30.0"
        type: string
        default: ""

# One sync at a time. A queued run waits; cancelling one mid-merge would leave
# the checkout in a state the next run has to reason about.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync develop and mirror tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      develop_moved: ${{ steps.sync.outputs.develop_moved }}
      tags_pushed: ${{ steps.sync.outputs.tags_pushed }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7.0.1
        with:
          ref: develop
          # The merge needs the shared history, and the tag mirroring needs the
          # tag objects upstream created.
          fetch-depth: 0
          # Persisted for the pushes below, so a git error never prints it.
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Sync from upstream
        id: sync
        env:
          UPSTREAM_REPO: https://github.com/autobrr/qui.git
          BRANCH: develop
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          EXTRA_TAG: ${{ inputs.tag }}
        run: ./.github/scripts/sync-upstream.sh
